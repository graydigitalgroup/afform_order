<div class="afo-order-details" ng-if="!$ctrl.isTemplate">
  <div ng-if="$ctrl.loading" class="afo-cart-loading">
    <i class="crm-i fa-spinner fa-spin"></i> {{ ts('Loading details…') }}
  </div>

  <div ng-if="$ctrl.ready && !$ctrl.loading">
    <label class="control-label afo-details-heading">{{ ts('Contribution Details') }}</label>

    <div class="afo-details-grid">
      <div class="afo-edit-field">
        <label>{{ ts('Contribution Date') }}</label>
        <input class="form-control" crm-ui-datepicker="{time: true}"
               ng-model="$ctrl.model.receive_date" />
      </div>
      <div class="afo-edit-field">
        <label>{{ ts('Source') }}</label>
        <input type="text" class="form-control" ng-model="$ctrl.model.source" />
      </div>
      <div class="afo-edit-field">
        <label>{{ ts('Receipt Date') }}</label>
        <input class="form-control" crm-ui-datepicker="{time: true}"
               ng-model="$ctrl.model.receipt_date" />
      </div>
      <div class="afo-edit-field">
        <label>{{ ts('Thank-you Date') }}</label>
        <input class="form-control" crm-ui-datepicker="{time: false}"
               ng-model="$ctrl.model.thankyou_date" />
      </div>
    </div>

    <!-- Email-receipt option (mirrors the core form's is_email_receipt +
         Receipt From select). Hidden entirely when no from-address resolved. -->
    <div class="afo-details-receipt" ng-if="$ctrl.fromEmails.length">
      <label class="afo-edit-checkbox-label">
        <input type="checkbox" ng-model="$ctrl.emailReceipt" />
        {{ ts('Email a receipt to the contributor') }}
      </label>
      <div class="afo-edit-field" ng-if="$ctrl.emailReceipt">
        <label>{{ ts('Receipt From') }}</label>
        <select class="form-control" ng-model="$ctrl.fromEmail"
                ng-options="opt.value as opt.label for opt in $ctrl.fromEmails">
        </select>
        <p class="afo-edit-help">
          {{ ts('The receipt date is set automatically when the receipt is sent, if it is not already set.') }}
        </p>
      </div>
    </div>

    <div class="afo-details-footer">
      <button type="button" class="crm-button"
              ng-click="$ctrl.save()" ng-disabled="$ctrl.saving">
        <i class="crm-i" ng-class="$ctrl.saving ? 'fa-spinner fa-spin' : 'fa-check'"></i>
        {{ $ctrl.saving ? ts('Saving…') : ts('Save details') }}
      </button>
    </div>
  </div>
</div>
