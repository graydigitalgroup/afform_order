<div class="afo-membership-status" ng-if="$ctrl.loaded">
  <label class="control-label" ng-if="$ctrl.label">{{ $ctrl.label }}</label>

         crm-ui-select="{data: $ctrl.select2Data, allowClear: true, placeholder: ts('Auto (calculated from dates)'), width: '220px'}"

</div>
